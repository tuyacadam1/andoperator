<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100 select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boolean Logic Problem Assignment</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Security Styles & Print Protection -->
  <style>
    /* Prevent text selection and drag gestures */
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    /* Print Protection: Hide everything when attempting to print */
    @media print {
      body {
        display: none !important;
      }
    }

    /* Blur class applied on tab focus loss or screenshot detection */
    .security-blur {
      filter: blur(28px) grayscale(100%);
      pointer-events: none;
    }

    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>

  <!-- SECURITY SHIELD OVERLAY (Triggers on blur/screenshot keypress) -->
